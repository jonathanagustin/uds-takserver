# The pod listens on more than the web bridge. The web container binds 6080.
# In the desktop container the TAKX JVM (CommonCommo) keeps one ephemeral
# HTTPS port for peer-to-peer mission packages and a web server on loopback;
# with takx.localInputs on it also binds TCP 4242 and 8087 on every address.
# Only 6080 is meant to be reached, and only along the path tenant gateway
# -> Authservice -> pod. Three things say so explicitly:
#
# 1. The NetworkPolicy below selects the pod and allows no ingress at all, so
#    the pod is isolated for ingress whatever else exists in the namespace.
#    NetworkPolicies only add up: the one ingress allowance is the policy the
#    UDS operator generates from `expose` in uds-package.yaml (TCP 6080 and
#    the HBONE port 15008 from the tenant gateway pods), next to its own
#    default-deny and its ambient health-probe policy. Enforced by the
#    cluster's NetworkPolicy controller (kube-router in k3s).
# 2. The AuthorizationPolicy below denies every connection to a port other
#    than 6080, from any source, before any allow policy is looked at.
#    Enforced by ztunnel: the namespace is in the ambient mesh, so every
#    inbound connection to the pod passes it.
# 3. For 6080 itself the UDS operator generates an ALLOW AuthorizationPolicy
#    from `expose` that names the gateway path; with it in place ztunnel
#    refuses every other source.
#
# None of the three covers a process in the node's host network namespace
# (below). For port 6080 that is what the bridge's own token check is for:
# the gate there answers 401 to anything without a valid token of this
# client and a required group, whoever connects (deployment.yaml).
#
# What the first deploy showed (2026-11-26, k3s with kube-router, Istio
# ambient; ../../zarf/README.md, "Which ports can be reached"):
#
# - From a pod in another namespace every port of the pod is refused by
#   NetworkPolicy. From a pod in the mesh, ztunnel sends the connection to the
#   pod's waypoint, where NetworkPolicy refuses it.
# - With a temporary NetworkPolicy that let a test namespace in, ztunnel still
#   closed 4242, 8087 and the ephemeral port with "explicitly denied by:
#   takx-desktop/takx-desktop-deny-other-ports", and the UDS operator's own
#   policy (deny-all-except-waypoint) closed 6080 for everything but the
#   waypoint, where Authservice answered. The sign-in path worked with the
#   DENY policy in place.
# - NOT closed by any policy: the node itself. A process in the node's host
#   network namespace reached pod-IP:6080 (HTTP 200, no sign-in, with the
#   image of that day) and the JVM's ports. kube-router accepts traffic "to
#   pods when source is the pod's local node", and Istio ambient exempts host
#   traffic from ztunnel so that kubelet probes work. No policy in a chart
#   can change that. Since then the image checks the token itself and starts
#   TAKX with its default inputs off: in the image self-test a client on the
#   host got 401 from port 6080 without a token and found 4242 and 8087
#   closed. In a cluster that is still to be shown. The ephemeral HTTPS port
#   stays reachable from the node, and root on the node can enter the pod's
#   namespaces whatever the pod does.
#
# Kubelet probes are exec probes and need no ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: takx-desktop-ingress-isolation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takx-desktop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "takx-desktop.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
{{- if .Values.network.denyOtherPorts }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: takx-desktop-deny-other-ports
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takx-desktop.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "takx-desktop.selectorLabels" . | nindent 6 }}
  action: DENY
  rules:
    - to:
        - operation:
            notPorts:
              - "6080"
{{- end }}
