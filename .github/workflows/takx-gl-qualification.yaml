name: TAKX Mesa Xvfb GL qualification

on:
  pull_request:
    paths:
      - "takx/client58-public-api/**"
      - "takx/compat/**"
      - "takx/contour-elevation/**"
      - "takx/contour-style/**"
      - "takx/gl-qualification/**"
      - "takx/kernel-client-interop/**"
      - "takx/kernel-elevation-jni/**"
      - "takx/kernel-feature-jni/**"
      - "takx/kernel-java/**"
      - "takx/kernel-native/**"
      - "takx/kernel-regressions/**"
      - "takx/kernel-render-context/**"
      - "takx/kernel-spatial-db/**"
      - "takx/kernel-texture/**"
      - "takx/contour-grid/**"
      - "takx/cot-conformance/**"
      - "takx/elevation-download-compat/**"
      - "takx/gis-java/**"
      - "takx/mission-package/**"
      - "takx/native-gdal-jni/**"
      - "takx/native-las/**"
      - "takx/sdk-coexist/**"
      - "takx/sdk-package/**"
      - "takx/sqlite-jdbc/**"
      - "takx/ui-java/**"
      - "takx/worldwind-java/**"
      - "takx/worldwind-consumers/**"
      - ".github/workflows/takx-gl-qualification.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: takx-gl-qual-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jonathanagustin/uds-takserver/takx-gl-runner:bookworm-amd64
    timeout-minutes: 10
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline GL qualification unit tests
        timeout-minutes: 2
        run: |
          python3 -B takx/gl-qualification/qualify.py --phase verify
          python3 -B -m unittest discover -s takx/gl-qualification -p test_qualify.py -v

      - name: Compile and run Mesa + Xvfb + JNI GLES3 qualification controls
        timeout-minutes: 5
        run: |
          python3 -B takx/gl-qualification/qualify.py \
            --phase qualify \
            --output "${RUNNER_TEMP}/takx-gl-qualification"

      - name: Retain verified GL qualification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-gl-qualification-receipt
          path: ${{ runner.temp }}/takx-gl-qualification/gl-qualification-receipt.json
          if-no-files-found: error
          retention-days: 14

  qualify-kernel-texture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline kernel-texture unit tests
        timeout-minutes: 2
        run: |
          python3 -B takx/kernel-texture/run_hosted_gl.py --phase verify
          python3 -B -m unittest discover -s takx/kernel-texture -p 'test_*.py' -v

      - name: Extract prebuilt GLES cache and run hosted kernel-texture GL controls
        timeout-minutes: 5
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/gles" "${RUNNER_TEMP}/kernel-texture-gl"
          cid="$(docker create ghcr.io/jonathanagustin/uds-takserver/takx-native-gles:1.7.0-amd64 /nonexistent)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/glvnd/." "${RUNNER_TEMP}/gles/"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work:ro" \
            -v "${RUNNER_TEMP}/gles:/opt/gles:ro" \
            -v "${RUNNER_TEMP}/kernel-texture-gl:/out" \
            ghcr.io/jonathanagustin/uds-takserver/takx-gl-runner:bookworm-amd64 \
            python3 -B /work/takx/kernel-texture/run_hosted_gl.py \
              --phase run \
              --gles-prefix /opt/gles \
              --receipt /out/hosted-gl-receipt.json

      - name: Retain verified kernel-texture hosted GL receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-kernel-texture-hosted-gl-receipt
          path: ${{ runner.temp }}/kernel-texture-gl/hosted-gl-receipt.json
          if-no-files-found: error
          retention-days: 14

  qualify-render-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline render-context verifier tests
        timeout-minutes: 2
        run: |
          python3 -B takx/kernel-render-context/run_hosted_controls.py --phase verify
          python3 -B -m unittest discover -s takx/kernel-render-context -p 'test_*.py' -v

      - name: Fetch pinned upstream ATAK Kernel commit
        timeout-minutes: 5
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/official-atak"
          git -C "${RUNNER_TEMP}/official-atak" init -q
          git -C "${RUNNER_TEMP}/official-atak" remote add origin https://github.com/TAK-Product-Center/atak-civ.git
          git -C "${RUNNER_TEMP}/official-atak" fetch --depth 1 origin 9f6893dd657feacc35ec5de03dad721c2e44170e
          git -C "${RUNNER_TEMP}/official-atak" checkout -q FETCH_HEAD

      - name: Run live prepare, BindingStateTest (88 assertions), and RetirableWorker C++ control
        timeout-minutes: 8
        run: |
          python3 -B takx/kernel-render-context/run_hosted_controls.py \
            --phase qualify \
            --official-source "${RUNNER_TEMP}/official-atak" \
            --output "${RUNNER_TEMP}/takx-render-context-hosted"

      - name: Retain verified render-context hosted control receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-render-context-hosted-receipt
          path: ${{ runner.temp }}/takx-render-context-hosted/hosted-render-context-receipt.json
          if-no-files-found: error
          retention-days: 14

  qualify-contour-grid:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jonathanagustin/uds-takserver/takx-gl-runner:bookworm-amd64
    timeout-minutes: 10
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline contour-grid unit tests
        timeout-minutes: 2
        run: |
          python3 -B takx/contour-grid/run_hosted_controls.py --phase verify
          python3 -B -m unittest discover -s takx/contour-grid -p 'test_*.py' -v

      - name: Compile and run all 1,258 contour-grid controls under Linux JDK 17 -Xcheck:jni
        timeout-minutes: 5
        run: |
          python3 -B takx/contour-grid/run_hosted_controls.py \
            --phase run \
            --receipt "${RUNNER_TEMP}/contour-grid-hosted/receipt.json"

      - name: Retain verified contour-grid hosted receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-contour-grid-hosted-receipt
          path: ${{ runner.temp }}/contour-grid-hosted/receipt.json
          if-no-files-found: error
          retention-days: 14

  qualify-contour-style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline contour-style verifier tests
        timeout-minutes: 2
        run: |
          python3 -B takx/contour-style/run_hosted_controls.py --phase verify
          python3 -B -m unittest discover -s takx/contour-style -p 'test_*.py' -v

      - name: Fetch pinned TAKX, ATAK Kernel, and Jakarta annotation inputs
        timeout-minutes: 4
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/pinned-takx" "${RUNNER_TEMP}/pinned-kernel" "${RUNNER_TEMP}/pinned-deps"
          git -C "${RUNNER_TEMP}/pinned-takx" init -q
          git -C "${RUNNER_TEMP}/pinned-takx" remote add origin https://github.com/TAK-Product-Center/TAKX.git
          git -C "${RUNNER_TEMP}/pinned-takx" fetch --depth 1 origin af54a3e1fe8796b6e109e2e5925dbef524ea7e31
          git -C "${RUNNER_TEMP}/pinned-takx" checkout -q FETCH_HEAD

          git -C "${RUNNER_TEMP}/pinned-kernel" init -q
          git -C "${RUNNER_TEMP}/pinned-kernel" remote add origin https://github.com/TAK-Product-Center/atak-civ.git
          git -C "${RUNNER_TEMP}/pinned-kernel" fetch --depth 1 origin 9f6893dd657feacc35ec5de03dad721c2e44170e
          git -C "${RUNNER_TEMP}/pinned-kernel" checkout -q FETCH_HEAD

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            https://maven-central.storage-download.googleapis.com/maven2/jakarta/annotation/jakarta.annotation-api/2.1.1/jakarta.annotation-api-2.1.1.jar \
            -o "${RUNNER_TEMP}/pinned-deps/jakarta.annotation-api-2.1.1.jar" \
          || curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            https://repo1.maven.org/maven2/jakarta/annotation/jakarta.annotation-api/2.1.1/jakarta.annotation-api-2.1.1.jar \
            -o "${RUNNER_TEMP}/pinned-deps/jakarta.annotation-api-2.1.1.jar"

      - name: Run live contour-style 311 model and 23 pinned TAKX caller controls on Linux JDK 17
        timeout-minutes: 4
        run: |
          python3 -B takx/contour-style/run_hosted_controls.py \
            --phase qualify \
            --takx "${RUNNER_TEMP}/pinned-takx" \
            --kernel "${RUNNER_TEMP}/pinned-kernel" \
            --annotations "${RUNNER_TEMP}/pinned-deps/jakarta.annotation-api-2.1.1.jar" \
            --output "${RUNNER_TEMP}/takx-contour-style-hosted"

      - name: Retain verified contour-style hosted control receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-contour-style-hosted-receipt
          path: ${{ runner.temp }}/takx-contour-style-hosted/hosted-contour-style-receipt.json
          if-no-files-found: error
          retention-days: 14

  qualify-compat-java:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jonathanagustin/uds-takserver/takx-gl-runner:bookworm-amd64
    timeout-minutes: 10
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline compat Java verifier tests
        timeout-minutes: 2
        run: |
          python3 -B takx/compat/run_hosted_controls.py --phase verify
          python3 -B -m unittest discover -s takx/compat -p 'test_run_hosted_controls.py' -v

      - name: Fetch pinned upstream ATAK Kernel commit
        timeout-minutes: 4
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/pinned-atak"
          git -C "${RUNNER_TEMP}/pinned-atak" init -q
          git -C "${RUNNER_TEMP}/pinned-atak" remote add origin https://github.com/TAK-Product-Center/atak-civ.git
          git -C "${RUNNER_TEMP}/pinned-atak" fetch --depth 1 origin 9f6893dd657feacc35ec5de03dad721c2e44170e
          git -C "${RUNNER_TEMP}/pinned-atak" checkout -q FETCH_HEAD

      - name: Run all seven takx/compat Java compatibility suites live on Linux JDK 17
        timeout-minutes: 5
        run: |
          python3 -B takx/compat/run_hosted_controls.py \
            --phase qualify \
            --atak-source "${RUNNER_TEMP}/pinned-atak" \
            --output "${RUNNER_TEMP}/takx-compat-java-hosted"

      - name: Retain verified compat Java hosted control receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-compat-java-hosted-receipt
          path: ${{ runner.temp }}/takx-compat-java-hosted/hosted-compat-java-receipt.json
          if-no-files-found: error
          retention-days: 14

  qualify-ui-java:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jonathanagustin/uds-takserver/takx-gl-runner:bookworm-amd64
    timeout-minutes: 15
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline ui-java verifier and unit tests
        timeout-minutes: 2
        run: |
          python3 -B takx/ui-java/run_hosted_controls.py --phase verify
          python3 -B -m unittest discover -s takx/ui-java -p 'test_*.py' -v

      - name: Build all five locked ui-java artifacts live on Linux JDK 17
        timeout-minutes: 10
        run: |
          python3 -B takx/ui-java/run_hosted_controls.py \
            --phase qualify \
            --profile original \
            --output "${RUNNER_TEMP}/takx-ui-java-hosted"

      - name: Retain verified ui-java hosted control receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-ui-java-hosted-receipt
          path: ${{ runner.temp }}/takx-ui-java-hosted/hosted-ui-java-receipt.json
          if-no-files-found: error
          retention-days: 14

  qualify-mission-package:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jonathanagustin/uds-takserver/takx-gl-runner:bookworm-amd64
    timeout-minutes: 10
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline mission-package verifier and unit tests
        timeout-minutes: 2
        run: |
          python3 -B takx/mission-package/run_hosted_controls.py --phase verify
          python3 -B -m unittest discover -s takx/mission-package -p 'test_*.py' -v

      - name: Fetch pinned upstream TAKX commit
        timeout-minutes: 4
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/pinned-takx"
          git -C "${RUNNER_TEMP}/pinned-takx" init -q
          git -C "${RUNNER_TEMP}/pinned-takx" remote add origin https://github.com/TAK-Product-Center/TAKX.git
          git -C "${RUNNER_TEMP}/pinned-takx" fetch --depth 1 origin 0b59a9bb2d0e90dc35c9edfff1c2056daab2b713
          git -C "${RUNNER_TEMP}/pinned-takx" checkout -q FETCH_HEAD

      - name: Run official conformance and projected admission controls live on Linux JDK 17
        timeout-minutes: 5
        run: |
          python3 -B takx/mission-package/run_hosted_controls.py \
            --phase qualify \
            --takx-source "${RUNNER_TEMP}/pinned-takx" \
            --output "${RUNNER_TEMP}/takx-mission-package-hosted"

      - name: Retain verified mission-package hosted control receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-mission-package-hosted-receipt
          path: ${{ runner.temp }}/takx-mission-package-hosted/hosted-mission-package-receipt.json
          if-no-files-found: error
          retention-days: 14

  qualify-cot-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline cot-conformance verifier and unit tests
        timeout-minutes: 2
        run: |
          python3 -B takx/cot-conformance/run_hosted_controls.py --phase verify
          python3 -B -m unittest discover -s takx/cot-conformance -p 'test_*.py' -v

      - name: Fetch pinned upstream ATAK commoncommo sources and prebuilt OCI caches
        timeout-minutes: 5
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/pinned-atak"
          git -C "${RUNNER_TEMP}/pinned-atak" init -q
          git -C "${RUNNER_TEMP}/pinned-atak" remote add origin https://github.com/TAK-Product-Center/atak-civ.git
          git -C "${RUNNER_TEMP}/pinned-atak" fetch --depth 1 --filter=blob:none origin 9f6893dd657feacc35ec5de03dad721c2e44170e
          git -C "${RUNNER_TEMP}/pinned-atak" sparse-checkout init --no-cone
          git -C "${RUNNER_TEMP}/pinned-atak" sparse-checkout set /commoncommo/
          git -C "${RUNNER_TEMP}/pinned-atak" checkout -q FETCH_HEAD

          mkdir -p "${RUNNER_TEMP}/commo-deps/include" "${RUNNER_TEMP}/commo-deps/lib"
          for spec in \
            "commoncommo:1.17.2-amd64" \
            "zlib:1.3.1-amd64" \
            "libiconv:1.15-amd64" \
            "libxml2:2.13.3-amd64" \
            "quictls:3.0.14-quic1-amd64" \
            "nghttp2:1.62.1-amd64" \
            "ngtcp2:1.6.0-amd64" \
            "libmicrohttpd:1.0.1-amd64" \
            "protobuf:3.21.0-amd64"; do
            dep_name="${spec%%:*}"
            dep_tag="${spec#*:}"
            dep_cid="$(docker create "ghcr.io/jonathanagustin/uds-takserver/takx-native-${dep_name}:${dep_tag}" "/${dep_name}")"
            mkdir -p "${RUNNER_TEMP}/dep-${dep_name}"
            docker cp "${dep_cid}:/${dep_name}/." "${RUNNER_TEMP}/dep-${dep_name}/"
            docker rm "${dep_cid}"
            if [ -d "${RUNNER_TEMP}/dep-${dep_name}/include" ]; then
              cp -a "${RUNNER_TEMP}/dep-${dep_name}/include/." "${RUNNER_TEMP}/commo-deps/include/"
            fi
            if [ -d "${RUNNER_TEMP}/dep-${dep_name}/lib" ]; then
              cp -a "${RUNNER_TEMP}/dep-${dep_name}/lib/." "${RUNNER_TEMP}/commo-deps/lib/"
            fi
          done

      - name: Run CommonCommo JNI smokes and CoT protocol conformance live on Linux JDK 17
        timeout-minutes: 8
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/takx-cot-conformance-hosted"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work:ro" \
            -v "${RUNNER_TEMP}/pinned-atak:/atak:ro" \
            -v "${RUNNER_TEMP}/commo-deps:/deps:ro" \
            -v "${RUNNER_TEMP}/takx-cot-conformance-hosted:/out" \
            ghcr.io/jonathanagustin/uds-takserver/takx-gl-runner:bookworm-amd64 \
            python3 -B /work/takx/cot-conformance/run_hosted_controls.py \
              --phase qualify \
              --atak-source /atak \
              --deps-prefix /deps \
              --output /out

      - name: Retain verified cot-conformance hosted control receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-cot-conformance-hosted-receipt
          path: ${{ runner.temp }}/takx-cot-conformance-hosted/hosted-cot-conformance-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified CommonCommo JAR and JNI library for downstream coexistence qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-cot-conformance-build-output
          path: |
            ${{ runner.temp }}/takx-cot-conformance-hosted/jcommoncommo.jar
            ${{ runner.temp }}/takx-cot-conformance-hosted/lib/libcommoncommojni.so
            ${{ runner.temp }}/takx-cot-conformance-hosted/hosted-cot-conformance-receipt.json
          if-no-files-found: error
          retention-days: 1

  qualify-gdal-data:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jonathanagustin/uds-takserver/takx-gl-runner:bookworm-amd64
    timeout-minutes: 10
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline gdal-data verifier and unit tests
        timeout-minutes: 2
        run: |
          python3 -B takx/gis-java/data/run_hosted_controls.py --phase verify
          python3 -B -m unittest discover -s takx/gis-java/data -p 'test_*.py' -v

      - name: Build deterministic GDAL data JAR and run 93 JDK 17 resource lookups
        timeout-minutes: 5
        run: |
          python3 -B takx/gis-java/data/run_hosted_controls.py \
            --phase qualify \
            --output "${RUNNER_TEMP}/takx-gdal-data-hosted"

      - name: Retain verified gdal-data hosted control receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-gdal-data-hosted-receipt
          path: ${{ runner.temp }}/takx-gdal-data-hosted/hosted-gdal-data-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified gdal-data JAR for downstream qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-gdal-data-build-output
          path: ${{ runner.temp }}/takx-gdal-data-hosted/build-1/uds-takserver-gdal-data.jar
          if-no-files-found: error
          retention-days: 1

  qualify-kernel-spatial-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline kernel-spatial-db verifier and unit tests
        timeout-minutes: 2
        run: |
          python3 -B takx/kernel-spatial-db/run_hosted_controls.py --phase verify
          python3 -B -m unittest discover -s takx/kernel-spatial-db -p 'test_*.py' -v

      - name: Fetch pinned upstream ATAK Kernel C++ sources and prebuilt OCI caches
        timeout-minutes: 5
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/pinned-atak"
          git -C "${RUNNER_TEMP}/pinned-atak" init -q
          git -C "${RUNNER_TEMP}/pinned-atak" remote add origin https://github.com/TAK-Product-Center/atak-civ.git
          git -C "${RUNNER_TEMP}/pinned-atak" fetch --depth 1 --filter=blob:none origin 9f6893dd657feacc35ec5de03dad721c2e44170e
          git -C "${RUNNER_TEMP}/pinned-atak" sparse-checkout init --no-cone
