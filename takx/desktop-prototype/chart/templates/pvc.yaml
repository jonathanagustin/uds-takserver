{{- if .Values.persistence.enabled }}
# The session directory, kept across pods. It holds the TAKX project, which
# includes TAKX's own copies of the PKCS#12 files and their passwords once a
# connection is saved: with persistence on, that key material is on this
# volume at rest. Without it the session is a memory-backed emptyDir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: takx-desktop-session
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takx-desktop.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
