# No RoleBinding refers to this account and its token is not mounted. It
# exists so the pod does not run as the namespace default account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: takx-desktop
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takx-desktop.labels" . | nindent 4 }}
automountServiceAccountToken: false
