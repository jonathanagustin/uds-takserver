name: CloudTAK image

# Test and this workflow share immutable-key producer queues. The first
# successful producer publishes; later producers recheck and reuse the tag.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the published image has the same inputs
        default: false
        type: boolean
  pull_request:
    paths:
      - .gitmodules
      - upstream/cloudtak
      - .github/container-and-chart/cloudtak/**
      - .github/workflows/cloudtak-image.yaml
      - .github/workflows/image-keys.yaml
      - .github/actions/attest-images/**
      - .github/scripts/candidate-*.py
  push:
    branches:
      - main
    paths:
      - .gitmodules
      - upstream/cloudtak
      - .github/container-and-chart/cloudtak/**
      - .github/workflows/cloudtak-image.yaml
      - .github/workflows/image-keys.yaml
      - .github/actions/attest-images/**
      - .github/scripts/candidate-*.py

permissions:
  contents: read

concurrency:
  # A newer pull request push or main push cancels the older run of this
  # workflow on that ref. Schedule and workflow_dispatch each get their own
  # run id: they are not cancelled, and they do not wait behind a push.
  # Release and Demo Video are not in this group. A finished run is kept.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  image-keys:
    uses: ./.github/workflows/image-keys.yaml
    permissions:
      contents: read

  # One native runner per architecture, each pushing <version>-<key>-<arch>
  # and, on main, <version>-<arch>. index joins them under <version>, the
  # tag zarf.yaml references.
  build:
    needs: image-keys
    # Shared by Test and the dedicated image workflow. Recheck the tag only
    # after this key's previous producer has finished. FIFO retains waiters.
    concurrency:
      group: image-cloudtak-${{ needs.image-keys.outputs.cloudtak }}-${{ matrix.arch }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUSH_IMAGES: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # build.sh fetches only upstream/cloudtak, shallow.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          PUSHED_REFS: ${{ runner.temp }}/pushed-refs.txt
          ARCH: ${{ matrix.arch }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "${FORCE}" = "true" ]; then
            ./.github/container-and-chart/cloudtak/build.sh
          else
            ./.github/container-and-chart/cloudtak/build.sh --if-changed
          fi

      - name: Preserve the verified fork candidate
        if: env.PUSH_IMAGES != 'true'
        run: |
          version="$(git config -f .gitmodules submodule.upstream/cloudtak.branch)"
          python3 .github/scripts/candidate-artifacts.py export --group cloudtak --architecture "${{ matrix.arch }}" --source-tag "${version}" --directory "${{ runner.temp }}/candidate"

      - name: Upload the native fork candidate
        if: env.PUSH_IMAGES != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-cloudtak-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

      - name: Attest the pushed images
        if: env.PUSH_IMAGES == 'true'
        uses: ./.github/actions/attest-images
        with:
          refs-file: ${{ runner.temp }}/pushed-refs.txt

  index:
    # Shared by Test and the dedicated image workflow. Recheck the tag only
    # after this key's previous producer has finished. FIFO retains waiters.
    concurrency:
      group: image-cloudtak-${{ needs.image-keys.outputs.cloudtak }}-index
      queue: max
      cancel-in-progress: false
    timeout-minutes: 15
    needs: [image-keys, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the multi-arch index
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PUSHED_REFS: ${{ runner.temp }}/pushed-refs.txt
        run: ./.github/container-and-chart/cloudtak/build.sh --merge

      - name: Attest the pushed images
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/attest-images
        with:
          refs-file: ${{ runner.temp }}/pushed-refs.txt
          include-platforms: "false"

      - name: Require both native fork candidates
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/candidate-consumer.py ready --group cloudtak
