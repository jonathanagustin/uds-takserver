name: TAKX native OCI caches

on:
  pull_request:
    paths:
      - "takx/native-caches/**"
      - ".github/workflows/takx-native-caches.yaml"
  push:
    branches:
      - main
    paths:
      - "takx/native-caches/**"
      - ".github/workflows/takx-native-caches.yaml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish prebuilt TAKX Layer-0 native OCI caches to GHCR
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: takx-native-caches-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: zlib
            tag: 1.3.1-amd64
            control: zlib_control.c
            link_args: "/opt/cache/lib/libz.a"
          - component: expat
            tag: 2.10.0-amd64
            control: expat_control.c
            link_args: "/opt/cache/lib/libexpat.a"
          - component: quictls
            tag: 3.0.14-quic1-amd64
            control: quictls_control.c
            link_args: "/opt/cache/lib/libssl.a /opt/cache/lib/libcrypto.a -lpthread -ldl"
          - component: openssl
            tag: 3.5.9-amd64
            control: openssl_control.c
            link_args: "/opt/cache/lib/libssl.a /opt/cache/lib/libcrypto.a -lpthread -ldl"
          - component: nghttp2
            tag: 1.62.1-amd64
            control: nghttp2_control.c
            link_args: "/opt/cache/lib/libnghttp2.a"
          - component: libmicrohttpd
            tag: 1.0.1-amd64
            control: libmicrohttpd_control.c
            link_args: "/opt/cache/lib/libmicrohttpd.a -lpthread"
          - component: protobuf
            tag: 3.21.0-amd64
            control: protobuf_control.cpp
            link_args: "/opt/cache/lib/libprotobuf-lite.a -lpthread"
          - component: uriparser
            tag: 0.9.8-amd64
            control: uriparser_control.c
            link_args: "/opt/cache/lib/liburiparser.a"
          - component: fmt
            tag: 10.2.1-amd64
            control: fmt_control.cpp
            link_args: "/opt/cache/lib/libfmt.a"
          - component: zstd
            tag: 1.5.6-amd64
            control: zstd_control.c
            link_args: "/opt/cache/lib/libzstd.a -lpthread"
          - component: meshoptimizer
            tag: 0.20-amd64
            control: meshoptimizer_control.cpp
            link_args: "/opt/cache/lib/libmeshoptimizer.a"
          - component: asyncplusplus
            tag: 1.1-amd64
            control: asyncplusplus_control.cpp
            link_args: "/opt/cache/lib/libasync++.a -lpthread"
          - component: tinyxml2
            tag: 10.0.0-amd64
            control: tinyxml2_control.cpp
            link_args: "/opt/cache/lib/libtinyxml2.a"
          - component: libjpeg-turbo
            tag: 3.0.3-amd64
            control: libjpeg_turbo_control.c
            link_args: "/opt/cache/lib/libjpeg.a -lm"
          - component: libwebp
            tag: 1.4.0-amd64
            control: libwebp_control.c
            link_args: "/opt/cache/lib/libwebp.a /opt/cache/lib/libsharpyuv.a -lm -lpthread"
          - component: draco
            tag: 1.5.7-amd64
            control: draco_control.cpp
            link_args: "/opt/cache/lib/libdraco.a"
          - component: zlib-ng
            tag: 2.1.5-amd64
            control: zlib_ng_control.c
            link_args: "/opt/cache/lib/libz-ng.a"
          - component: sqlite3
            tag: 3.46.0-amd64
            control: sqlite3_control.c
            link_args: "/opt/cache/lib/libsqlite3.a -lpthread -ldl -lm"
    name: qualify (${{ matrix.component }})
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline native cache verifier tests
        timeout-minutes: 2
        run: |
          python3 -B takx/native-caches/verify.py --phase verify --component "${{ matrix.component }}"
          python3 -B -m unittest discover -s takx/native-caches -p test_verify.py -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.component }} OCI cache locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: takx/native-caches/${{ matrix.component }}
          file: takx/native-caches/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: takx-native-${{ matrix.component }}:smoke
          cache-from: type=gha,scope=takx-native-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=takx-native-${{ matrix.component }}

      - name: Extract and qualify restored prefix inside prebuilt takx-gl-runner
        timeout-minutes: 5
        env:
          COMPONENT: ${{ matrix.component }}
          CONTROL: ${{ matrix.control }}
          LINK_ARGS: ${{ matrix.link_args }}
        run: |
          set -eu
          cid="$(docker create "takx-native-${COMPONENT}:smoke" "/${COMPONENT}")"
          mkdir -p "${RUNNER_TEMP}/restored-${COMPONENT}"
          docker cp "${cid}:/${COMPONENT}/." "${RUNNER_TEMP}/restored-${COMPONENT}/"
          docker rm "${cid}"
          python3 -B takx/native-caches/verify.py \
            --phase check-prefix --component "${COMPONENT}" \
            --prefix "${RUNNER_TEMP}/restored-${COMPONENT}"
          docker run --rm \
            -e CONTROL="${CONTROL}" \
            -e LINK_ARGS="${LINK_ARGS}" \
            -v "${GITHUB_WORKSPACE}/takx/native-caches/${COMPONENT}:/src:ro" \
            -v "${RUNNER_TEMP}/restored-${COMPONENT}:/opt/cache:ro" \
            ghcr.io/jonathanagustin/uds-takserver/takx-gl-runner:bookworm-amd64 \
            bash -euo pipefail -c '
              if [ -x /opt/cache/bin/protoc ]; then
                /opt/cache/bin/protoc --version
              fi
              # shellcheck disable=SC2086
              if [[ "${CONTROL}" == *.cpp ]]; then
                g++ -std=c++17 -Wall -Wextra -Werror -O2 \
                  -isystem /opt/cache/include "/src/${CONTROL}" ${LINK_ARGS} \
                  -o /tmp/control_bin
              else
                gcc -std=c99 -Wall -Wextra -Werror -O2 \
                  -I/opt/cache/include "/src/${CONTROL}" ${LINK_ARGS} \
                  -o /tmp/control_bin
              fi
              /tmp/control_bin
            '

      - name: Retain verified cache receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-native-${{ matrix.component }}-receipt
          path: ${{ runner.temp }}/restored-${{ matrix.component }}/cache-receipt.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build-and-qualify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: zlib
            tag: 1.3.1-amd64
          - component: expat
            tag: 2.10.0-amd64
          - component: quictls
            tag: 3.0.14-quic1-amd64
          - component: openssl
            tag: 3.5.9-amd64
          - component: nghttp2
            tag: 1.62.1-amd64
          - component: libmicrohttpd
            tag: 1.0.1-amd64
          - component: protobuf
            tag: 3.21.0-amd64
          - component: uriparser
            tag: 0.9.8-amd64
          - component: fmt
            tag: 10.2.1-amd64
          - component: zstd
            tag: 1.5.6-amd64
          - component: meshoptimizer
            tag: 0.20-amd64
          - component: asyncplusplus
            tag: 1.1-amd64
          - component: tinyxml2
            tag: 10.0.0-amd64
          - component: libjpeg-turbo
            tag: 3.0.3-amd64
          - component: libwebp
            tag: 1.4.0-amd64
          - component: draco
            tag: 1.5.7-amd64
          - component: zlib-ng
            tag: 2.1.5-amd64
          - component: sqlite3
            tag: 3.46.0-amd64
    name: publish (${{ matrix.component }})
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prebuilt ${{ matrix.component }} OCI cache
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: takx/native-caches/${{ matrix.component }}
          file: takx/native-caches/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jonathanagustin/uds-takserver/takx-native-${{ matrix.component }}:${{ matrix.tag }}
            ghcr.io/jonathanagustin/uds-takserver/takx-native-${{ matrix.component }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=takx-native-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=takx-native-${{ matrix.component }}

      - name: Attest OCI cache build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/jonathanagustin/uds-takserver/takx-native-${{ matrix.component }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-and-qualify-layer1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: curl
            tag: 8.23.0-amd64
            control: curl_control.c
            link_args: "/opt/cache/lib/libcurl.a /opt/openssl/lib/libssl.a /opt/openssl/lib/libcrypto.a /opt/zlib/lib/libz.a -lpthread -ldl"
          - component: sqlcipher
            tag: 4.5.7-amd64
            control: sqlcipher_control.c
            link_args: "/opt/cache/lib/libsqlite3.a /opt/openssl/lib/libcrypto.a -lpthread -ldl -lm"
          - component: laszip
            tag: 3.4.3-amd64
            control: laszip_control.c
            link_args: "/opt/cache/lib/liblaszip.a -lstdc++ -lm"
          - component: assimp
            tag: 4.0.1-amd64
            control: assimp_control.c
            link_args: "/opt/cache/lib/libassimp.a /opt/cache/lib/libIrrXML.a /opt/zlib/lib/libz.a -lstdc++ -lm"
          - component: ngtcp2
            tag: 1.6.0-amd64
            control: ngtcp2_control.c
            link_args: "/opt/cache/lib/libngtcp2_crypto_quictls.a /opt/cache/lib/libngtcp2.a /opt/quictls/lib/libssl.a /opt/quictls/lib/libcrypto.a -lpthread -ldl"
          - component: spdlog
            tag: 1.14.1-amd64
            control: spdlog_control.cpp
            link_args: "/opt/cache/lib/libspdlog.a /opt/fmt/lib/libfmt.a -lpthread"
    name: qualify (${{ matrix.component }})
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline native cache verifier tests
        timeout-minutes: 2
        run: |
          python3 -B takx/native-caches/verify.py --phase verify --component "${{ matrix.component }}"
          python3 -B -m unittest discover -s takx/native-caches -p test_verify.py -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.component }} OCI cache locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: takx/native-caches/${{ matrix.component }}
          file: takx/native-caches/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: takx-native-${{ matrix.component }}:smoke
          cache-from: type=gha,scope=takx-native-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=takx-native-${{ matrix.component }}

      - name: Extract and qualify restored prefix inside prebuilt takx-gl-runner
        timeout-minutes: 5
        env:
          COMPONENT: ${{ matrix.component }}
          CONTROL: ${{ matrix.control }}
          LINK_ARGS: ${{ matrix.link_args }}
        run: |
          set -eu
          cid="$(docker create "takx-native-${COMPONENT}:smoke" "/${COMPONENT}")"
          mkdir -p "${RUNNER_TEMP}/restored-${COMPONENT}"
          docker cp "${cid}:/${COMPONENT}/." "${RUNNER_TEMP}/restored-${COMPONENT}/"
          docker rm "${cid}"
          python3 -B takx/native-caches/verify.py \
            --phase check-prefix --component "${COMPONENT}" \
            --prefix "${RUNNER_TEMP}/restored-${COMPONENT}"
          ossl_cid="$(docker create ghcr.io/jonathanagustin/uds-takserver/takx-native-openssl:3.5.9-amd64 /openssl)"
          mkdir -p "${RUNNER_TEMP}/dep-openssl"
          docker cp "${ossl_cid}:/openssl/." "${RUNNER_TEMP}/dep-openssl/"
          docker rm "${ossl_cid}"
          quictls_cid="$(docker create ghcr.io/jonathanagustin/uds-takserver/takx-native-quictls:3.0.14-quic1-amd64 /quictls)"
          mkdir -p "${RUNNER_TEMP}/dep-quictls"
          docker cp "${quictls_cid}:/quictls/." "${RUNNER_TEMP}/dep-quictls/"
          docker rm "${quictls_cid}"
          zlib_cid="$(docker create ghcr.io/jonathanagustin/uds-takserver/takx-native-zlib:1.3.1-amd64 /zlib)"
          mkdir -p "${RUNNER_TEMP}/dep-zlib"
          docker cp "${zlib_cid}:/zlib/." "${RUNNER_TEMP}/dep-zlib/"
          docker rm "${zlib_cid}"
          fmt_cid="$(docker create ghcr.io/jonathanagustin/uds-takserver/takx-native-fmt:10.2.1-amd64 /fmt)"
          mkdir -p "${RUNNER_TEMP}/dep-fmt"
          docker cp "${fmt_cid}:/fmt/." "${RUNNER_TEMP}/dep-fmt/"
          docker rm "${fmt_cid}"
          extra_inc="-I/opt/openssl/include"
          if [ "${COMPONENT}" = "ngtcp2" ]; then
            extra_inc="-I/opt/quictls/include"
          fi
          docker run --rm \
            -e CONTROL="${CONTROL}" \
            -e EXTRA_INC="${extra_inc}" \
            -e LINK_ARGS="${LINK_ARGS}" \
            -v "${GITHUB_WORKSPACE}/takx/native-caches/${COMPONENT}:/src:ro" \
            -v "${RUNNER_TEMP}/restored-${COMPONENT}:/opt/cache:ro" \
            -v "${RUNNER_TEMP}/dep-openssl:/opt/openssl:ro" \
            -v "${RUNNER_TEMP}/dep-quictls:/opt/quictls:ro" \
            -v "${RUNNER_TEMP}/dep-zlib:/opt/zlib:ro" \
            -v "${RUNNER_TEMP}/dep-fmt:/opt/fmt:ro" \
            ghcr.io/jonathanagustin/uds-takserver/takx-gl-runner:bookworm-amd64 \
            bash -euo pipefail -c '
              # shellcheck disable=SC2086
              if [[ "${CONTROL}" == *.cpp ]]; then
                g++ -std=c++17 -Wall -Wextra -Werror -O2 \
                  -I/opt/cache/include ${EXTRA_INC} -I/opt/zlib/include -I/opt/fmt/include \
                  "/src/${CONTROL}" ${LINK_ARGS} \
                  -o /tmp/control_bin
              else
                gcc -std=c99 -Wall -Wextra -Werror -O2 \
                  -I/opt/cache/include ${EXTRA_INC} -I/opt/zlib/include -I/opt/fmt/include \
                  "/src/${CONTROL}" ${LINK_ARGS} \
                  -o /tmp/control_bin
              fi
              /tmp/control_bin
            '

      - name: Retain verified cache receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-native-${{ matrix.component }}-receipt
          path: ${{ runner.temp }}/restored-${{ matrix.component }}/cache-receipt.json
          if-no-files-found: error
          retention-days: 14

  publish-layer1:
    needs: [build-and-qualify-layer1, publish]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: curl
            tag: 8.23.0-amd64
          - component: sqlcipher
            tag: 4.5.7-amd64
          - component: laszip
            tag: 3.4.3-amd64
          - component: assimp
            tag: 4.0.1-amd64
          - component: ngtcp2
            tag: 1.6.0-amd64
          - component: spdlog
            tag: 1.14.1-amd64
    name: publish (${{ matrix.component }})
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prebuilt ${{ matrix.component }} OCI cache
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: takx/native-caches/${{ matrix.component }}
          file: takx/native-caches/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jonathanagustin/uds-takserver/takx-native-${{ matrix.component }}:${{ matrix.tag }}
            ghcr.io/jonathanagustin/uds-takserver/takx-native-${{ matrix.component }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=takx-native-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=takx-native-${{ matrix.component }}

      - name: Attest OCI cache build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/jonathanagustin/uds-takserver/takx-native-${{ matrix.component }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
