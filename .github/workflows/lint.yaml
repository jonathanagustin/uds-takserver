name: Lint

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

permissions:
  contents: read

# Keep only the latest validation for each pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hk:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: uv
          cache: true

      - name: Install hk tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # Names have to match mise.toml. yamllint and codespell are PyPI tools
          # and need uv installed first. uds-cli is only in the aqua registry.
          install_args: hk shellcheck actionlint helm node pypi:yamllint pypi:codespell aqua:defenseunicorns/uds-cli aqua:gitleaks/gitleaks aqua:hadolint/hadolint aqua:google/osv-scanner
          cache: true

      - name: hk check
        run: hk check --all

  validate:
    uses: defenseunicorns/uds-common/.github/workflows/callable-lint.yaml@807de6f4efca9f51ee5e8d3e466d5f089c9eaab8 # v1.34.1
