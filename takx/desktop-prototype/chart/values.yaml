# Values of the TAKX 5.7 desktop prototype chart. values.schema.json checks
# them; an unknown key is an error. The Zarf package in ../zarf maps its
# `desktop` package value onto this file, so every key here can be set at
# deploy time with `--set-values desktop.<key>=...`.

# Domain suffix of the UDS gateways. The package maps global.domain here.
domain: uds.dev
# The desktop is served at https://<host>.<domain>/ on the tenant gateway.
host: takx

# The one image of the pod. All three containers run it with a different
# mode (identity, desktop, web). ../zarf/create-package.sh replaces the tag
# in the staged copy, and ../zarf/image-values.yaml sets the reference of
# the packaged image at deploy time. As written here the tag is a
# placeholder that only lets `helm lint` and `helm template` render.
image: ghcr.io/jonathanagustin/uds-takserver/takx-desktop:takx-build-tag
imagePullPolicy: IfNotPresent

# Who may open the desktop. Two things check it, and the chart has no switch
# for either: Authservice at the tenant gateway (sign-in at Keycloak, which
# issues a token for this client only to members of `groups`), and the bridge
# in the pod itself, which verifies that token on every request (`auth`).
sso:
  clientId: uds-takx-desktop
  # Keycloak group paths that may open the desktop. Everyone in these groups
  # shares the one session and the one TAK identity. The same list is what
  # the bridge looks for in the token's groups claim.
  groups:
    - /UDS Core/Admin

# The bridge's own check (../image/web_gate.py, web_auth.py). Authservice
# adds the ID token of the session to every request as
# `Authorization: Bearer <JWT>`. The bridge verifies its signature against
# the realm's keys, the issuer, the audience (sso.clientId), the expiry and
# the groups claim (sso.groups) before it sends one byte of noVNC or of the
# desktop. A request without such a token is answered 401 or 403, also when
# it comes from the node itself, where no NetworkPolicy and no mesh policy
# applies.
auth:
  # `iss` of the token. Empty: https://sso.<domain>/realms/uds.
  issuer: ""
  # Where the bridge fetches the realm's signing keys: Keycloak's Service in
  # the cluster, over the mesh. The UDS Package gets an egress rule for it
  # (`keycloak` below). When this is unreachable the bridge lets nobody in.
  jwksUrl: http://keycloak-http.keycloak.svc.cluster.local:8080/realms/uds/protocol/openid-connect/certs
  # Signature algorithms accepted. The UDS realm signs with RS256. Others
  # the bridge can verify: RS384, RS512, ES256, ES384.
  algorithms:
    - RS256
  # Claim that lists the user's group paths. The UDS realm writes `groups`
  # into the ID token (client scope `profile`, full paths).
  groupsClaim: groups
  # Seconds of clock difference tolerated for exp, nbf and iat.
  leewaySeconds: 10
  # How long a WebSocket may stay open after its upgrade. Then the bridge
  # closes it, noVNC reconnects by itself and has to pass Authservice and
  # the bridge again with a fresh token: a session that has ended at
  # Keycloak loses the desktop after at most this long. 0: until the expiry
  # of the token the WebSocket was opened with (60 seconds in the UDS realm
  # by default, so the screen reconnects every minute).
  websocketMaxSeconds: 300
  # Pods of Keycloak (its waypoint carries the same label), for the egress
  # rule of the key fetch.
  keycloak:
    namespace: keycloak
    selector:
      app.kubernetes.io/name: keycloak
    port: 8080

display:
  # WIDTHxHEIGHT of the X desktop. 1920x1080 is the only size that was run.
  geometry: 1920x1080
  # Colour depth: 16, 24 or 32.
  depth: 24

jvm:
  # EXTRA_JVM_OPTS of the official runTakx command line. With -Xmx2g the
  # container peaked at 2.1 to 2.2 GB after five idle minutes in the image
  # self-test. In the first deploy (43 minutes in a pod, a connection, a few
  # markers, one browser) it stayed between 1.8 and 2.0 GiB, peak 2.1 GiB.
  extraOpts: "-Xmx2g"

takx:
  # TAKX program arguments, space separated. Empty: `-create` when no
  # project exists, otherwise none.
  args: ""
  # false: a new session starts with every default network input of TAKX
  # switched off in its program properties (CommonCommo/DefaultInputs: TCP
  # and UDP 4242 and 8087, UDP 10011, six multicast groups), so the JVM does
  # not listen on them. Nothing in a pod can use them; the TAK Server
  # connection is outbound. true: the client's defaults. Either way the JVM
  # keeps one ephemeral HTTPS port for peer-to-peer mission packages, for
  # which TAKX has no setting.
  localInputs: false

web:
  # Seconds between WebSocket pings from the bridge to the browser, so that
  # a session with a still screen never looks idle to a proxy on the path.
  # Keep it below the idleTimeout of templates/bridge-connections.yaml.
  heartbeatSeconds: 25

identity:
  # Secret in this namespace with the keys package.zip and password: the
  # two-key copy of a TakClient device Secret that the package component
  # takx-desktop-identity makes. It is optional. Without it the init
  # container stages nothing and the desktop starts without an identity.
  secretName: takx-desktop-identity
  # Reject a package whose connect string names another host. Empty: not
  # checked. The TakClient operator writes takserver-stream.<domain>.
  expectHost: ""
  # Also stage takx-package.zip with this host in the connect string. Empty:
  # tak.certName. TAKX checks the server name it dials against the server
  # certificate, and the issued package names takserver-stream.<domain>,
  # which is not in that certificate.
  connectHost: ""

tak:
  # The only DNS name in the TAK Server certificate of this repository's
  # package (common name and subject alternative name). TAKX has to dial this
  # name; the pod gets a hosts entry that maps it to the passthrough gateway.
  certName: takserver
  gateway:
    namespace: istio-passthrough-gateway
    service: passthrough-ingressgateway
    # Pod labels of the passthrough gateway, for the egress rules.
    selector:
      app: passthrough-ingressgateway
    # Address for the hosts entry. Empty: the ClusterIP of the Service above,
    # read with a Helm lookup when the chart is installed or upgraded. A
    # render without a cluster (`helm template`, `zarf dev inspect`) finds
    # nothing and writes no hosts entry.
    ip: ""
  egress:
    # TCP 8089, Cursor on Target streaming with the client certificate.
    streaming: true
    # TCP 443, the client-certificate API by SNI. Off: TAKX 5.7 asks
    # https://<address>:8443 for missions and contacts, which the gateway does
    # not serve, and it sends the dialled name as SNI, so 443 would not
    # answer it either. See ../STATUS.md, "HTTPS API from TAKX".
    api: false
  # Further hosts entries of the pod: [{ip: 10.0.0.1, hostnames: [name]}].
  hostAliases: []

egress:
  # External hosts the desktop may reach on TCP 443 with TLS, for example a
  # map tile server. Each entry becomes one remoteHost rule of the UDS
  # Package. Empty: the pod reaches the passthrough gateway and DNS only, and
  # TAKX shows its built-in base map.
  hosts: []

network:
  # true: an Istio AuthorizationPolicy with action DENY for every port of the
  # pod other than 6080 (templates/ingress-isolation.yaml). With
  # takx.localInputs off the TAKX JVM still listens on one ephemeral port;
  # ztunnel then refuses it from any pod. The NetworkPolicy that isolates the
  # pod for ingress is always rendered. In the first deploy the sign-in path
  # through the gateway worked with this policy in place, and ztunnel's log
  # named it when a test pod was let through the NetworkPolicy. Neither
  # layer covers a process on the node itself; there the bridge's own token
  # check is what stands (../zarf/README.md).
  denyOtherPorts: true

session:
  # true: the session directory (ProjectData, home, the JVM's temporary
  # directory, the run tree) is a memory-backed emptyDir. Once a TAK Server
  # connection is added, TAKX copies the PKCS#12 files into its project
  # (ProjectData/Globals/Files/SslCerts, mode 0644) and keeps their passwords
  # in a credential database there; in memory they never reach a disk of the
  # node and are gone with the pod. The files count against the memory limit
  # of the desktop container (resources.desktop). false: an emptyDir on the
  # node's disk, which then holds that key material until the pod is deleted.
  # Ignored when persistence.enabled is true.
  memory: true
  # Size limit of the emptyDir. A fresh session is about 270 MB, most of it
  # the Kernel's native libraries, which are extracted at every start.
  sizeLimit: 1Gi

persistence:
  # false: the session directory is the emptyDir above and is lost with the
  # pod, including a TAK Server connection saved in the project. true: a
  # PersistentVolumeClaim of `size` keeps it, and the volume then holds
  # TAKX's own copies of the PKCS#12 files and their passwords at rest: key
  # material on disk, by choice. A start on an existing project has not been
  # run with this image.
  enabled: false
  size: 2Gi
  # Empty: the cluster default StorageClass.
  storageClass: ""

resources:
  identity:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # The memory limit covers the JVM and, with session.memory, the files of
  # the session directory: about 2.1 GiB at the peak for the processes
  # (-Xmx2g) plus up to session.sizeLimit (1Gi), 3.2 GiB together, inside the
  # 5Gi limit. The request is what a fresh session uses: about 2.0 GiB of
  # processes and 0.27 GiB of files.
  desktop:
    requests: {cpu: 500m, memory: 2560Mi}
    limits: {cpu: "2", memory: 5Gi}
  # The bridge: the gate (one Python process, about 25 MiB) and websockify,
  # which forks one process per connection. The gate closes every connection
  # after one request, so those processes do not pile up.
  web:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
