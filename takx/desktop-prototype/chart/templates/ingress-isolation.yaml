# The pod listens on more than the web bridge. In the desktop container the
# TAKX JVM (CommonCommo) binds TCP 4242 and 8087 on every address, one
# ephemeral port for its HTTPS proxy, and a web server on loopback; the web
# container binds 6080. Only 6080 is meant to be reached, and only along the
# path tenant gateway -> Authservice -> pod. Three things say so explicitly:
#
# 1. The NetworkPolicy below selects the pod and allows no ingress at all, so
#    the pod is isolated for ingress whatever else exists in the namespace.
#    NetworkPolicies only add up: the one ingress allowance is the policy the
#    UDS operator generates from `expose` in uds-package.yaml (TCP 6080 and
#    the HBONE port 15008 from the tenant gateway pods), next to its own
#    default-deny and its ambient health-probe policy. Enforced by the
#    cluster's NetworkPolicy controller (kube-router in k3s).
# 2. The AuthorizationPolicy below denies every connection to a port other
#    than 6080, from any source, before any allow policy is looked at.
#    Enforced by ztunnel: the namespace is in the ambient mesh, so every
#    inbound connection to the pod passes it.
# 3. For 6080 itself the UDS operator generates an ALLOW AuthorizationPolicy
#    from `expose` that names the gateway path; with it in place ztunnel
#    refuses every other source.
#
# None of this has been exercised in a cluster: the chart has not been
# deployed. Kubelet probes are exec probes and need no ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: takx-desktop-ingress-isolation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takx-desktop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "takx-desktop.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
{{- if .Values.network.denyOtherPorts }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: takx-desktop-deny-other-ports
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takx-desktop.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "takx-desktop.selectorLabels" . | nindent 6 }}
  action: DENY
  rules:
    - to:
        - operation:
            notPorts:
              - "6080"
{{- end }}
