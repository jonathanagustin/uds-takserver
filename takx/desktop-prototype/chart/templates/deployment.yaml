# One pod, one image, three containers (../image/README.md, "Entrypoint
# modes"):
#
#   identity (init)  uid 10001  validates the copied TakClient Secret and
#                               stages it under /run/takx/identity. The only
#                               container that sees the Secret volume.
#   desktop          uid 10001  Xtigervnc on a Unix socket, openbox, the TAKX
#                               JVM. The X server has no TCP port. The JVM
#                               would listen: by default CommonCommo binds TCP
#                               4242 and 8087 on every address. A new session
#                               starts with those inputs switched off in the
#                               client's own program properties
#                               (takx.localInputs); one ephemeral HTTPS port
#                               of CommonCommo stays. Nothing may reach it:
#                               ingress-isolation.yaml.
#   web              uid 10002  The gate on TCP 6080 and, behind it on a Unix
#                               socket, websockify: noVNC, bridged to the RFB
#                               socket. The gate verifies the token Authservice
#                               forwards on every request (auth in values.yaml)
#                               and answers 401 or 403 otherwise, whoever asks
#                               and from wherever. The container reads the
#                               socket directory and nothing else, so the HTTP
#                               parser that faces the gateway cannot read the
#                               identity files.
#
# The root filesystem of every container is read-only. One replica: the
# session is one X display and one TAK identity, so a second pod would be a
# second client with the same certificate.
{{- $gatewayIP := include "takx-desktop.gatewayIP" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takx-desktop
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takx-desktop.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The session volume is ReadWriteOnce when persistence is on, and two
  # clients must never share the identity.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "takx-desktop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      # Selector labels only, so a chart version change alone does not
      # restart the session.
      labels:
        {{- include "takx-desktop.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: takx-desktop
    spec:
      serviceAccountName: takx-desktop
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # The image is linux/amd64 only.
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Group of the RFB socket. The web container gets it as a
        # supplementary group, which is how uid 10002 may connect.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- if or $gatewayIP .Values.tak.hostAliases }}
      hostAliases:
        {{- if $gatewayIP }}
        # TAKX checks the server name it dials against the TAK Server
        # certificate, which names only this host.
        - ip: {{ $gatewayIP | quote }}
          hostnames:
            - {{ .Values.tak.certName | quote }}
        {{- end }}
        {{- with .Values.tak.hostAliases }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: identity
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["identity"]
          env:
            {{- with .Values.identity.expectHost }}
            - name: TAKX_IDENTITY_EXPECT_HOST
              value: {{ . | quote }}
            {{- end }}
            - name: TAKX_IDENTITY_CONNECT_HOST
              value: {{ .Values.identity.connectHost | default .Values.tak.certName | quote }}
          securityContext:
            {{- include "takx-desktop.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.identity | nindent 12 }}
          volumeMounts:
            - name: identity-secret
              mountPath: /run/takx/secret
              readOnly: true
            - name: identity
              mountPath: /run/takx/identity
      containers:
        - name: desktop
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["desktop"]
          env:
            - name: EXTRA_JVM_OPTS
              value: {{ .Values.jvm.extraOpts | quote }}
            {{- with .Values.takx.args }}
            - name: TAKX_ARGS
              value: {{ . | quote }}
            {{- end }}
            - name: TAKX_GEOMETRY
              value: {{ .Values.display.geometry | quote }}
            - name: TAKX_DEPTH
              value: {{ .Values.display.depth | quote }}
            - name: TAKX_LOCAL_INPUTS
              value: {{ ternary "default" "off" .Values.takx.localInputs | quote }}
          securityContext:
            {{- include "takx-desktop.containerSecurityContext" . | nindent 12 }}
          # started: the JVM runs and the main window with a project is
          # mapped. Ten minutes; the image self-test saw 30 to 40 seconds on
          # 1.5 CPUs.
          startupProbe:
            exec:
              command: ["/opt/takx-desktop/healthcheck.sh", "started"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/opt/takx-desktop/healthcheck.sh", "ready"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/opt/takx-desktop/healthcheck.sh", "live"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.desktop | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: session
              mountPath: /run/takx/session
            - name: vnc
              mountPath: /run/takx/vnc
            - name: identity
              mountPath: /run/takx/identity
              readOnly: true
        - name: web
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["web"]
          # What the gate checks before a request reaches noVNC or the
          # desktop. There is no value that switches the check off.
          env:
            - name: TAKX_AUTH_MODE
              value: "oidc"
            - name: TAKX_AUTH_ISSUER
              value: {{ include "takx-desktop.issuer" . | quote }}
            - name: TAKX_AUTH_AUDIENCE
              value: {{ .Values.sso.clientId | quote }}
            - name: TAKX_AUTH_GROUPS
              value: {{ .Values.sso.groups | toJson | quote }}
            - name: TAKX_AUTH_GROUPS_CLAIM
              value: {{ .Values.auth.groupsClaim | quote }}
            - name: TAKX_AUTH_JWKS_URL
              value: {{ .Values.auth.jwksUrl | quote }}
            - name: TAKX_AUTH_ALGORITHMS
              value: {{ join "," .Values.auth.algorithms | quote }}
            - name: TAKX_AUTH_LEEWAY_SECONDS
              value: {{ .Values.auth.leewaySeconds | quote }}
            - name: TAKX_AUTH_WS_MAX_SECONDS
              value: {{ .Values.auth.websocketMaxSeconds | quote }}
            # A WebSocket that names an Origin must come from the desktop's
            # own page.
            - name: TAKX_AUTH_ORIGIN
              value: {{ include "takx-desktop.url" . | quote }}
            - name: TAKX_WEB_HEARTBEAT
              value: {{ .Values.web.heartbeatSeconds | quote }}
          ports:
            - name: http
              containerPort: 6080
              protocol: TCP
          securityContext:
            {{- include "takx-desktop.containerSecurityContext" . | nindent 12 }}
            runAsUser: 10002
            runAsGroup: 10002
          # An exec probe: it asks the gate for /healthz on loopback, so it
          # does not depend on how the mesh treats kubelet traffic. /healthz
          # needs no token and answers "ok" and nothing else.
          readinessProbe:
            exec:
              command: ["/opt/takx-desktop/healthcheck.sh", "web"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/opt/takx-desktop/healthcheck.sh", "web"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
          volumeMounts:
            - name: vnc
              mountPath: /run/takx/vnc
              readOnly: true
            - name: web
              mountPath: /run/takx/web
      volumes:
        # X socket and lock file.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        # ProjectData, home, java.io.tmpdir, the run tree. Must allow exec:
        # the Kernel loader maps its native libraries from here. In memory by
        # default: TAKX copies the client key store into its project once a
        # connection is added, and that copy must not reach the node's disk.
        - name: session
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: takx-desktop-session
          {{- else }}
          emptyDir:
            {{- if .Values.session.memory }}
            medium: Memory
            {{- end }}
            sizeLimit: {{ .Values.session.sizeLimit | quote }}
          {{- end }}
        # rfb.sock, mode 0660, group 10001.
        - name: vnc
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # websockify's listening socket, behind the gate. Mounted in the web
        # container only; the entrypoint keeps the socket at mode 0600.
        - name: web
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # Staged identity files, mode 0400, uid 10001. Never on disk.
        - name: identity
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        # Optional: without the Secret the desktop starts with no identity.
        - name: identity-secret
          secret:
            secretName: {{ .Values.identity.secretName | quote }}
            optional: true
            # 0440, in decimal: YAML readers disagree about a leading zero.
            # Owner root, group 10001 (fsGroup), so uid 10001 may read it.
            defaultMode: 288
