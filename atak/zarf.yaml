# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/v0.89.0/src/pkg/schema/zarf-v1beta1-package-schema.json
#
# Optional ATAK-CIV test device: KubeVirt, an Android-x86 VM with ATAK, and a
# phone viewer behind Keycloak. It is a separate package so the TAK package
# does not carry about 1.5 GB of VM and KubeVirt images. amd64 nodes with
# /dev/kvm only. Deploy it after the TAK package; see docs/atak-device.md.
#
#   ./atak/ci/create-package.sh 5.5.1.10 --confirm
#   uds zarf package deploy zarf-package-atak-device-amd64-*.tar.zst --confirm
apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: atak-device
  description: ATAK-CIV in a KubeVirt VM as a TAK test client (amd64 with KVM only)
  version: "atak-build-tag"
  architecture: amd64

values:
  files: [values.yaml]

components:
  - name: kubevirt
    description: KubeVirt v1.9.1 and the UDS policy exemption it needs
    selector:
      architecture: amd64
    manifests:
      - name: kubevirt-exemption
        files:
          - deploy/kubevirt-exemption.yaml
      # v1.8.4 and later publish the VMI checksum fields with uint32 bounds
      # (v1.6.6 and v1.7.4 do not). Kubernetes 1.37 (k3s v1.37.1 in CI)
      # enforces numeric formats, so with the int32 schema virt-handler can
      # never move the VMI past Scheduled.
      - name: kubevirt-operator
        files:
          - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-operator.yaml@9ac45a436c49d32e6fc21d542bcb7600b970705297b9e6752f3ef9b0a1d292da
      - name: kubevirt-cr
        files:
          # The release CR with the ImageVolume and Template gates disabled;
          # see the comment in the file.
          - deploy/kubevirt-cr.yaml
    images:
      - name: quay.io/kubevirt/virt-operator:v1.9.1
      - name: quay.io/kubevirt/virt-api:v1.9.1
      - name: quay.io/kubevirt/virt-controller:v1.9.1
      - name: quay.io/kubevirt/virt-handler:v1.9.1
      - name: quay.io/kubevirt/virt-launcher:v1.9.1
      - name: quay.io/kubevirt/virt-exportproxy:v1.9.1
      - name: quay.io/kubevirt/virt-exportserver:v1.9.1
    actions:
      onDeploy:
        onSuccess:
          - description: Wait for KubeVirt
            maxTotalSeconds: 900
            wait:
              cluster:
                kind: kubevirt
                name: kubevirt
                namespace: kubevirt
                condition: Available

  - name: atak-device
    description: The ATAK VM, its adb Service, the phone viewer, and their UDS Package
    selector:
      architecture: amd64
    manifests:
      - name: atak-device
        namespace: atak
        enableTemplating: true
        files:
          - deploy/device.yaml
    images:
      - name: ghcr.io/jonathanagustin/uds-takserver/atak-civ-vm:atak-build-tag
        id: atak-vm
        source: registry
      - name: ghcr.io/jonathanagustin/uds-takserver/atak-viewer:atak-build-tag
        id: atak-viewer
        source: registry
    actions:
      onDeploy:
        onSuccess:
          - description: Wait for the VM to boot its kernel
            maxTotalSeconds: 900
            wait:
              cluster:
                kind: vmi
                name: atak-device
                namespace: atak
                condition: Ready
          - description: Wait for the viewer
            maxTotalSeconds: 300
            wait:
              cluster:
                kind: deployment
                name: atak-viewer
                namespace: atak
                condition: Available
