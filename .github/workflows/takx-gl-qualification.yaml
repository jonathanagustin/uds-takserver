      - name: Build pinned SWIG 4.3.0 and qualify GIS Java JARs
        timeout-minutes: 8
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre2-dev
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://downloads.sourceforge.net/project/swig/swig/swig-4.3.0/swig-4.3.0.tar.gz" \
            -o "${RUNNER_TEMP}/swig-4.3.0.tar.gz"
          printf '%s  %s\n' "f7203ef796f61af986c70c05816236cbd0d31b7aa9631e5ab53020ab7804aa9e" "${RUNNER_TEMP}/swig-4.3.0.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/swig-4.3.0.tar.gz" -C "${RUNNER_TEMP}"
          (
            cd "${RUNNER_TEMP}/swig-4.3.0"
            PATH="${JAVA_HOME_17_X64}/bin:${PATH}" ./configure \
              --prefix="${RUNNER_TEMP}/swig-install" \
              --without-alllang \
              --with-java
            make -j4
            make install
          )
          python3 -B takx/gis-java/run_hosted_controls.py \
            --phase qualify \
            --java-home "${JAVA_HOME_17_X64}" \
            --swig-bin "${RUNNER_TEMP}/swig-install/bin/swig" \
            --swig-lib "${RUNNER_TEMP}/swig-install/share/swig/4.3.0" \
            --output "${RUNNER_TEMP}/gis-java"

      - name: Compile all 1,176 Kernel engine-shared Java sources and 59 compat adapters live on JDK 17
        timeout-minutes: 8
        run: |
          python3 -B takx/kernel-java/run_hosted_controls.py \
            --phase qualify \
            --atak-source "${RUNNER_TEMP}/pinned-atak" \
            --gis-build "${RUNNER_TEMP}/gis-java/build" \
            --java-home "${JAVA_HOME_17_X64}" \
            --output "${RUNNER_TEMP}/takx-kernel-java-hosted"

      - name: Retain verified kernel-java hosted control receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-kernel-java-hosted-receipt
          path: ${{ runner.temp }}/takx-kernel-java-hosted/hosted-kernel-java-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified kernel-java classes, JNI headers, and classpath for native qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-kernel-java-build-output
          path: |
            ${{ runner.temp }}/takx-kernel-java-hosted/proof/classes
            ${{ runner.temp }}/takx-kernel-java-hosted/proof/jni-headers
            ${{ runner.temp }}/takx-kernel-java-hosted/proof/classpath
          if-no-files-found: error
          retention-days: 1

  qualify-worldwind-consumers:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jonathanagustin/uds-takserver/takx-gl-runner:bookworm-amd64
    timeout-minutes: 10
    steps:
      - name: Checkout candidate source
