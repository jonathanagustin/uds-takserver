name: Native cache PR consumer

on:
  pull_request:
    paths:
      - "takx/registry-cache/**"
      - "takx/native-deps/build.py"
      - "takx/native-deps/DracoSourceProbe.cpp"
      - "takx/geos-cache/**"
      - "takx/native-geos/**"
      - ".github/workflows/native-cache-pr.yaml"
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: native-cache-pr-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draco:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned read-only registry tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          mise_toml: |
            [tools]
            crane = "0.22.1"
            gh = "2.103.3"
          cache: true
      - name: Verify the approved immutable cache
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B takx/registry-cache/pr_consumer.py --restore --output "$RUNNER_TEMP/draco-pr-cache"
          python3 -c 'import json,os; from pathlib import Path; hit=json.loads((Path(os.environ["RUNNER_TEMP"])/"draco-pr-cache/result.json").read_text())["cacheHit"]; print("hit="+str(hit).lower())' >> "$GITHUB_OUTPUT"
      - name: Install pinned consumer tools
        if: steps.cache.outputs.hit == 'true'
        run: python3 -B takx/registry-cache/producer.py tools --cache "$RUNNER_TEMP/draco-tools"
      - name: Exercise the cached library at two fresh prefixes
        if: steps.cache.outputs.hit == 'true'
        run: |
          python3 -B takx/registry-cache/producer.py consume \
            --input "$RUNNER_TEMP/draco-pr-cache/verified" --output "$RUNNER_TEMP/draco-pr-consumer" \
            --tools "$RUNNER_TEMP/draco-tools/cmake"
      - name: Checkout the pinned official source for a compatibility miss
        if: steps.cache.outputs.hit == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAK-Product-Center/atak-civ
          ref: 9f6893dd657feacc35ec5de03dad721c2e44170e
          path: upstream-native
          sparse-checkout: draco
          persist-credentials: false
      - name: Build and qualify fresh when build inputs differ
        if: steps.cache.outputs.hit == 'false'
        run: |
          python3 -B takx/registry-cache/producer.py build \
            --source "$GITHUB_WORKSPACE/upstream-native" --output "$RUNNER_TEMP/draco-pr-fresh" \
            --cache "$RUNNER_TEMP/draco-tools"
      - name: Retain only cache selection and consumer evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draco-pr-consumer
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/draco-pr-cache/result.json
            ${{ runner.temp }}/draco-pr-consumer/restored.json
            ${{ runner.temp }}/draco-pr-fresh/build/registry-receipt.json

  geos:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned read-only registry tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          mise_toml: |
            [tools]
            crane = "0.22.1"
            gh = "2.104.0"
          cache: true
      - name: Verify the approved immutable GEOS cache
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B takx/geos-cache/pr_consumer.py --restore --output "$RUNNER_TEMP/geos-pr-cache"
          python3 -c 'import json,os; from pathlib import Path; hit=json.loads((Path(os.environ["RUNNER_TEMP"])/"geos-pr-cache/result.json").read_text())["cacheHit"]; print("hit="+str(hit).lower())' >> "$GITHUB_OUTPUT"
      - name: Require native AMD64 and pull the exact compiler image
        run: |
          set -euo pipefail
          python3 -c 'import platform; assert platform.machine() == "x86_64", "native AMD64 required"'
          image="$(python3 -c 'import json; print(json.load(open("takx/geos-cache/inputs.lock.json"))["base_image"]["reference"])')"
          docker pull --platform linux/amd64 "${image}"
      - name: Exercise the cached GEOS library at two fresh prefixes
        if: steps.cache.outputs.hit == 'true'
        run: |
          python3 -c '
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          result = json.loads((root / "geos-pr-cache/result.json").read_text())
          subprocess.run([sys.executable, "-B", "takx/geos-cache/qualify.py", "--engine", "docker",
                          "--layout", str(root / "geos-pr-cache/verified/oci"),
                          "--subject", result["subjectDigest"], "--input-key", result["inputKey"],
                          "--output", str(root / "geos-pr-consumer")], check=True)
          '
      - name: Build and qualify fresh when GEOS build inputs differ
        if: steps.cache.outputs.hit == 'false'
        run: |
          python3 -B takx/geos-cache/producer.py --engine docker \
            --source-cache "${RUNNER_TEMP}/geos-pr-source" --output "${RUNNER_TEMP}/geos-pr-fresh"
          python3 -c '
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          proof = json.loads((root / "geos-pr-fresh/result.json").read_text())
          subprocess.run([sys.executable, "-B", "takx/geos-cache/qualify.py", "--engine", "docker",
                          "--layout", str(root / "geos-pr-fresh/oci"),
                          "--subject", proof["local_oci_subject"], "--input-key", proof["input_key"],
                          "--output", str(root / "geos-pr-consumer")], check=True)
          '
      - name: Retain only GEOS cache selection and consumer evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geos-pr-consumer
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/geos-pr-cache/result.json
            ${{ runner.temp }}/geos-pr-consumer/restored.json
            ${{ runner.temp }}/geos-pr-fresh/result.json
