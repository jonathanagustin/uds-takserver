# noVNC and its WebSocket, served by the web container behind its token
# check. The only port of the pod that a Service names and that policy lets
# in. The RFB protocol itself stays on a Unix socket inside the pod. The TAKX
# JVM in the desktop container listens on an ephemeral port as well (and on
# TCP 4242 and 8087 when takx.localInputs is on); those are closed by
# ingress-isolation.yaml and the operator's default deny.
apiVersion: v1
kind: Service
metadata:
  name: takx-desktop
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takx-desktop.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "takx-desktop.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 6080
      targetPort: http
      protocol: TCP
