name: Zarf Next live qualification

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "tests/zarf_next_live_qualification.py"
      - "tests/fixtures/zarf-beta-contract/**"
      - ".github/workflows/zarf-next-qualification.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  next-bundle-live:
    name: Live k3d Next-mode bundle qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv, k3d, and UDS CLI
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: uv k3d aqua:defenseunicorns/uds-cli
          cache: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign versioning=semver
          cosign-release: v3.1.4

      - name: Create disposable k3d cluster
        run: |
          set -euo pipefail
          k3d cluster create next-qual --servers 1 --agents 0 --wait --timeout 180s
          uds zarf tools kubectl wait --for=condition=Ready node --all --timeout=120s
          uds zarf tools kubectl create namespace zarf
          uds zarf tools kubectl create secret generic zarf-state -n zarf \
            --from-literal=state='{"zarfAppliance":false,"distro":"k3s","architecture":"amd64","storageClass":"local-path"}'

      - name: Qualify signed Next-mode deploy, opt-out, and v1alpha1 to v1beta1 upgrade
        run: uv run --no-project --with pyyaml==6.0.3 python -B -m tests.zarf_next_live_qualification --cli uds

      - name: Delete disposable k3d cluster
        if: always()
        run: k3d cluster delete next-qual || true
