            fi
            if [ -d "${RUNNER_TEMP}/dep-${dep_name}/lib" ]; then
              cp -a "${RUNNER_TEMP}/dep-${dep_name}/lib/." "${RUNNER_TEMP}/scene-deps/lib/"
