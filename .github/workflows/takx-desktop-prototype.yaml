# Opt-in build of the TAKX 5.7 desktop prototype (Kernel 8.30.5 + project
# patches, CommonCommo 1.17.2 patched; nothing is validated or qualified) on
# native amd64 and arm64 runners.
#
# It starts only when takx/desktop-prototype/ci/trigger changes on the listed
# branch, so ordinary pushes of the prototype do not spend runner hours. The
# trigger file is plain text: '#' comments and an optional line
# 'arches=arm64,amd64' (default: both). ci/pipeline.py documents it.
#
# Jobs follow the dependency waves of takx/desktop-prototype/ci/groups.json.
# Each job restores its prerequisites from the provider cache on GHCR, builds
# its own providers and pushes them, so later jobs and reruns do not rebuild.
# amd64 is the control: it uses the hand-built reference images when they can
# be pulled and then restores every provider from the existing cache. arm64
# runs from a patched copy of the tree (takx/desktop-prototype/arch_tree.py);
# no recipe or lock under takx/ is edited.
name: TAKX desktop prototype

on:
  push:
    branches:
      - claude/awesome-rubin-2godw2
    paths:
      - "takx/desktop-prototype/ci/trigger"
  # Usable only once this file is on the default branch.
  workflow_dispatch:
    inputs:
      arches:
        description: JSON list of architectures to build (amd64, arm64)
        type: string
        default: '["amd64","arm64"]'

permissions:
  contents: read

# One build per branch. A newer trigger waits: finished providers are already
# in the cache, so nothing is gained by cancelling a build half way.
concurrency:
  group: takx-desktop-prototype-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TAKX_PROTO_ROOT: /var/lib/takx-proto
  # The stages key the provider cache with the repository path, so every job
  # works on a copy at one fixed path (ci/enter.sh).
  TAKX_CI_REPO: /home/user/uds-takserver
  # CI-written namespaces, separate from the hand-pushed amd64 cache, which is
  # only read (as a second source) and never written by this workflow.
  TAKX_PROTO_CACHE: ghcr.io/jonathanagustin/uds-takserver/takx-desktop-proto-ci/cache
  TAKX_CI_CACHE_FALLBACK: ghcr.io/jonathanagustin/uds-takserver/takx-desktop-proto-cache
  CI_IMAGES: ghcr.io/jonathanagustin/uds-takserver/takx-desktop-proto-ci
  # The submodule is used for its Git objects and LFS pointers only; the stage
  # that needs LFS bytes fetches and verifies them itself.
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      arches: ${{ steps.plan.outputs.arches }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the job groups and read the trigger
        id: plan
        env:
          REQUESTED: ${{ inputs.arches }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B takx/desktop-prototype/ci/pipeline.py check
          python3 -I -B takx/desktop-prototype/arch_tree.py check
          python3 -I -B takx/desktop-prototype/ci/pipeline.py plan \
            --trigger takx/desktop-prototype/ci/trigger \
            --requested "${REQUESTED}" | tee -a "${GITHUB_OUTPUT}"

  toolchain:
    needs: plan
    name: toolchain (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.arches) }}
    outputs:
      # One output per architecture: matrix legs would overwrite a shared name.
      amd64: ${{ steps.images.outputs.amd64 }}
      arm64: ${{ steps.images.outputs.arm64 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record runner capacity
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          nproc
          free -g
          df -h /
          docker version --format '{{.Server.Version}}'
          docker info --format '{{.Driver}}'

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse or build the toolchain and runtime images
        id: images
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          takx/desktop-prototype/ci/images.sh "${ARCH}" > "${RUNNER_TEMP}/images.env"
          cat "${RUNNER_TEMP}/images.env"
          # shellcheck disable=SC1091
          . "${RUNNER_TEMP}/images.env"
          echo "${ARCH}=${TOOLCHAIN_IMAGE} ${RUNTIME_IMAGE} ${TOOLCHAIN_ID} ${IMAGE_SOURCE}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Images (${ARCH})"
            echo
            echo "- toolchain: \`${TOOLCHAIN_IMAGE}\`"
            echo "- runtime: \`${RUNTIME_IMAGE}\`"
            echo "- source: ${IMAGE_SOURCE} (reference = hand-built images, existing provider keys apply)"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Providers in dependency waves. A leg of a later wave runs even when another
  # architecture failed earlier; a leg whose own prerequisites are missing from
  # the cache stops as "blocked" before it builds anything.
  providers-a:
    needs: [plan, toolchain]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: ${{ matrix.group }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.arches) }}
        group: [native-base, geo-base, java]
    steps: &provider-steps
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the atak-civ submodule
        run: git submodule update --init --depth 1 upstream/atak-civ

      - name: Free runner disk
        run: ./.github/scripts/free-runner-disk.sh
        env:
          PRUNE_DOCKER: "true"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare the runner and fetch the pinned inputs
        env:
          ARCH: ${{ matrix.arch }}
          IMAGES: ${{ needs.toolchain.outputs[matrix.arch] }}
        run: takx/desktop-prototype/ci/enter.sh "${ARCH}" "${IMAGES}"

      - name: Restore prerequisites, build and push
        env:
          GROUP: ${{ matrix.group }}
        run: takx/desktop-prototype/ci/run-group.sh "${GROUP}"

      - name: Summarize statuses
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B takx/desktop-prototype/ci/pipeline.py summary "${TAKX_PROTO_ROOT}" >> "${GITHUB_STEP_SUMMARY}"
          df -h /

      - name: Make logs and status files readable
        if: always()
        run: sudo chmod -R a+rX "${TAKX_PROTO_ROOT}/logs" "${TAKX_PROTO_ROOT}/status" || true

      - name: Retain logs and status files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-proto-${{ matrix.arch }}-${{ matrix.group }}-logs
          path: |
            /var/lib/takx-proto/logs
            /var/lib/takx-proto/status
          if-no-files-found: warn
          retention-days: 14

  providers-b:
    needs: [plan, toolchain, providers-a]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: ${{ matrix.group }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.arches) }}
        group: [cesium, scene, commo]
    steps: *provider-steps

  providers-c:
    needs: [plan, toolchain, providers-b]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: ${{ matrix.group }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.arches) }}
        group: [kml]
    steps: *provider-steps

  # Composed Kernel, client compile, then assembly and boot. Nothing is pushed.
  client:
    needs: [plan, toolchain, providers-c]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: kernel, client, boot (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.arches) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the atak-civ submodule
        run: git submodule update --init --depth 1 upstream/atak-civ

      - name: Free runner disk
        run: ./.github/scripts/free-runner-disk.sh
        env:
          PRUNE_DOCKER: "true"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare the runner and fetch the pinned inputs
        env:
          ARCH: ${{ matrix.arch }}
          IMAGES: ${{ needs.toolchain.outputs[matrix.arch] }}
        run: takx/desktop-prototype/ci/enter.sh "${ARCH}" "${IMAGES}" --runtime

      - name: Restore every provider, build the Kernel and compile the client
        run: takx/desktop-prototype/ci/run-group.sh client

      # On arm64 this step is expected to fail until the assembler, which is
      # amd64-only today, is ported (takx/desktop-prototype/ci/ARCH-CACHE-NOTE.md).
      - name: Assemble and boot
        run: takx/desktop-prototype/ci/run-group.sh boot

      - name: Summarize statuses
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B takx/desktop-prototype/ci/pipeline.py summary "${TAKX_PROTO_ROOT}" >> "${GITHUB_STEP_SUMMARY}"
          df -h /

      - name: Collect receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p "${TAKX_PROTO_ROOT}/ci-receipts"
          for file in P/kernel-composed-src/composed-sources.json P/kernel-composed-native/composed-native.json \
              P/kernel-composed/receipt.json P/kernel-composed/controls/controls.json P/takx57/inputs.lock.json \
              P/takx57/result.json P/takx57-runtime-jars/manifest.json dist/takx57/manifest.json; do
            if sudo test -f "${TAKX_PROTO_ROOT}/${file}"; then
              sudo cp "${TAKX_PROTO_ROOT}/${file}" "${TAKX_PROTO_ROOT}/ci-receipts/${file//\//--}"
            fi
          done
          sudo cp "${TAKX_PROTO_ROOT}"/overrides/*/tree/.takx-arch-tree.json "${TAKX_PROTO_ROOT}/ci-receipts/" 2>/dev/null || true
          sudo chmod -R a+rX "${TAKX_PROTO_ROOT}/logs" "${TAKX_PROTO_ROOT}/status" "${TAKX_PROTO_ROOT}/ci-receipts" || true

      - name: Retain logs, status files and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takx-proto-${{ matrix.arch }}-client-logs
          path: |
            /var/lib/takx-proto/logs
            /var/lib/takx-proto/status
            /var/lib/takx-proto/ci-receipts
          if-no-files-found: warn
          retention-days: 14
