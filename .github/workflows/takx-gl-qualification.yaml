          tar -xzf "${RUNNER_TEMP}/libkml.tar.gz" -C "${RUNNER_TEMP}" libkml-1.3/third_party/zlib-1.2.3/contrib/minizip
          cp "${RUNNER_TEMP}"/libkml-1.3/third_party/zlib-1.2.3/contrib/minizip/*.h "${RUNNER_TEMP}/scene-deps/include/minizip/"

